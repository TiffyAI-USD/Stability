<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PancakeSwap V3 Pool Audit</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <style>
        body { font-family: monospace; background: #121212; color: #00ffcc; padding: 20px; }
        .card { background: #1e1e1e; border: 1px solid #333; padding: 15px; border-radius: 8px; margin-top: 15px; word-break: break-all; }
        button { background: #00ffcc; color: #000; border: none; padding: 12px 20px; font-weight: bold; border-radius: 5px; width: 100%; font-size: 16px; margin-top: 10px; }
        pre { white-space: pre-wrap; word-wrap: break-word; }
    </style>
</head>
<body>

    <h2>PancakeSwap V3 Pool Audit</h2>
    <p>Tap below to query your V3 pool's live state and liquidity parameters.</p>
    
    <button onclick="runV3Audit()">Audit V3 Pool</button>

    <div class="card">
        <h3>Output Log:</h3>
        <pre id="output">Waiting for action...</pre>
    </div>

    <script>
        async function runV3Audit() {
            const output = document.getElementById("output");
            output.innerText = "Connecting to BSC network...";

            const rpcUrls = [
                "https://bsc-dataseed1.binance.org/",
                "https://rpc.ankr.com/bsc"
            ];

            let provider = null;
            for (const url of rpcUrls) {
                try {
                    provider = new ethers.providers.JsonRpcProvider(url);
                    await provider.getBlockNumber();
                    break;
                } catch (e) { continue; }
            }

            if (!provider) {
                output.innerText = "Error: Could not connect to any RPC.";
                return;
            }

            try {
                const PAIR_ADDRESS = "0x859f7dc6c5bd2fb75a765cbba63a071941cdb2ac";
                const TUSD_TOKEN_ADDRESS = "0xcf11e2D51481Cb59Bf015FCc84324d1659984D07";

                // PancakeSwap V3 Pool ABI snippet
                const V3_POOL_ABI = [
                    "function token0() external view returns (address)",
                    "function token1() external view returns (address)",
                    "function fee() external view returns (uint24)",
                    "function liquidity() external view returns (uint128)",
                    "function slot0() external view returns (uint160 sqrtPriceX96, int24 tick, uint16 observationIndex, uint16 observationCardinality, uint16 observationCardinalityNext, uint8 feeProtocol, bool unlocked)"
                ];

                const ERC20_ABI = [
                    "function symbol() external view returns (string)",
                    "function decimals() external view returns (uint8)"
                ];

                const poolContract = new ethers.Contract(PAIR_ADDRESS, V3_POOL_ABI, provider);

                output.innerText = "Fetching V3 pool parameters...";

                const [t0, t1, feeTier, liquidity, slot0] = await Promise.all([
                    poolContract.token0(),
                    poolContract.token1(),
                    poolContract.fee(),
                    poolContract.liquidity(),
                    poolContract.slot0()
                ]);

                const token0Contract = new ethers.Contract(t0, ERC20_ABI, provider);
                const token1Contract = new ethers.Contract(t1, ERC20_ABI, provider);

                const [sym0, sym1] = await Promise.all([
                    token0Contract.symbol(),
                    token1Contract.symbol()
                ]);

                let statusText = "Status: SECURE V3 POOL";
                if (t0.toLowerCase() === TUSD_TOKEN_ADDRESS.toLowerCase() || 
                    t1.toLowerCase() === TUSD_TOKEN_ADDRESS.toLowerCase()) {
                    statusText += " - TUSD-Nitro verified inside this V3 pool!";
                }

                output.innerText = 
                    `=== PANCAKESWAP V3 POOL AUDIT ===\n\n` +
                    `Pool Address: ${PAIR_ADDRESS}\n` +
                    `Factory: Official V3 (0x0BFb...1865)\n\n` +
                    `Token 0: [${sym0}] (${t0})\n` +
                    `Token 1: [${sym1}] (${t1})\n` +
                    `Fee Tier: ${feeTier / 10000}%\n\n` +
                    `Active Liquidity: ${liquidity.toString()}\n` +
                    `Current Tick: ${slot0.tick}\n` +
                    `Unlocked: ${slot0.unlocked}\n\n` +
                    `${statusText}`;

            } catch (err) {
                output.innerText = "Error reading V3 contract: " + err.message;
            }
        }
    </script>
</body>
</html>
